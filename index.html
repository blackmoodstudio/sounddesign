<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Black Mood Studio — Sound Design</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #050505;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8vw;
    }

    .small {
      color: #e31b23;
      font-size: 14px;
      letter-spacing: 4px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(70px, 13vw, 190px);
      line-height: 0.8;
      letter-spacing: -7px;
    }

    .tagline {
      margin-top: 40px;
      font-size: clamp(20px, 3vw, 40px);
      font-weight: 300;
    }

    .services {
      margin-top: 18px;
      color: #999;
      font-size: 15px;
      letter-spacing: 2px;
    }

    .bottom {
      position: absolute;
      bottom: 35px;
      right: 40px;
      font-size: 13px;
      color: #777;
    }

    .red {
      color: #e31b23;
    }
  </style>
</head>

<body>

  <section class="hero">

    <div class="small">
      BLACK MOOD STUDIO PRESENTS
    </div>

    <h1>
      SOUND<br>
      <span class="red">DESIGN</span>
    </h1>

    <div class="tagline">
      YOUR IMAGES. OUR SOUND.
    </div>

    <div class="services">
      SOUND DESIGN · AUDIO REDESIGN · AUDIO POST PRODUCTION
    </div>

    <div class="bottom">
      Sound Design by Lorenzo Sesini
    </div>

  </section>

</body>
</html>
